name: EvalOps release checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare automatic grading with sample human labels
        run: python evalops.py calibrate
      - name: Evaluate candidate and enforce release policy
        run: python evalops.py release
      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evalops-reports
          path: reports/*.json
          if-no-files-found: ignore
